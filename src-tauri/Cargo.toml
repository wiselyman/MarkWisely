[package]
name = "markwisely"
version = "0.1.1"
description = "MarkWisely desktop Markdown editor"
authors = ["MarkWisely"]
license = "MIT"
repository = "https://github.com/wiselyman/MarkWisely"
edition = "2021"
rust-version = "1.85"

[lib]
name = "markwisely_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
comrak = "0.52"
html-escape = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-store = "2.4.3"
tauri-plugin-window-state = "2.4.1"
thiserror = "2"
typst = "0.14.2"
typst-as-lib = { version = "0.15.5", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-pdf = "0.14.2"
ureq = "2"
walkdir = "2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-log = "2.8.0"
log = "0.4.32"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSString"] }

[dev-dependencies]
tempfile = "3"
