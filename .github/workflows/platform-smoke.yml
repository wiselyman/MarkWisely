name: Platform Installer Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/platform-smoke.yml"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "src-tauri/**"

jobs:
  smoke:
    name: Smoke ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-x64
            platform: macos-15-intel
            target: x86_64-apple-darwin
            build_args: --target x86_64-apple-darwin
          - name: macos-arm64
            platform: macos-latest
            target: aarch64-apple-darwin
            build_args: --target aarch64-apple-darwin
          - name: windows-x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            build_args: --target x86_64-pc-windows-msvc
          - name: windows-arm64
            platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            build_args: --target aarch64-pc-windows-msvc
          - name: linux-x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            build_args: --target x86_64-unknown-linux-gnu --bundles deb,rpm
          - name: linux-arm64
            platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            build_args: --target aarch64-unknown-linux-gnu --bundles deb,rpm
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm xvfb xdotool openbox wmctrl
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build installer bundles
        run: npm run tauri -- build ${{ matrix.build_args }}
      - name: macOS launch and close smoke
        if: startsWith(matrix.name, 'macos-')
        run: |
          set -euo pipefail
          app_path="src-tauri/target/${{ matrix.target }}/release/bundle/macos/MarkWisely.app"
          test_doc="$RUNNER_TEMP/markwisely-open-smoke.md"
          printf '# Association Smoke\n\nOpened from Launch Services.\n' > "$test_doc"
          test -d "$app_path"
          open -n -a "$PWD/$app_path" "$test_doc"

          pid=""
          for _ in $(seq 1 30); do
            pid="$(pgrep -f 'MarkWisely.app/Contents/MacOS/markwisely' | head -n 1 || true)"
            if [ -n "$pid" ]; then
              break
            fi
            sleep 1
          done
          test -n "$pid"

          log_file="$HOME/Library/Logs/com.markwisely.desktop/MarkWisely.log"
          opened=""
          for _ in $(seq 1 24); do
            if [ -f "$log_file" ] && grep -q 'Opened markdown document: .*markwisely-open-smoke.md' "$log_file"; then
              opened="yes"
              break
            fi
            sleep 1
          done
          if [ "$opened" != "yes" ]; then
            echo "Expected Launch Services to open the Markdown document."
            tail -n 120 "$log_file" || true
            exit 1
          fi

          osascript -e 'tell application id "com.markwisely.desktop" to quit' || osascript -e 'tell application "MarkWisely" to quit'
          for _ in $(seq 1 20); do
            if ! kill -0 "$pid" 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done

          ps -p "$pid" -o pid=,command=
          kill "$pid" || true
          echo "MarkWisely did not exit after the macOS close request."
          exit 1
      - name: Windows launch and close smoke
        if: startsWith(matrix.name, 'windows-')
        shell: pwsh
        run: |
          $exe = "src-tauri/target/${{ matrix.target }}/release/markwisely.exe"
          if (-not (Test-Path $exe)) {
            throw "Missing MarkWisely executable at $exe"
          }
          $doc = Join-Path $env:RUNNER_TEMP "markwisely-open-smoke.md"
          Set-Content -Path $doc -Value "# Association Smoke`n`nOpened from argv."

          $process = Start-Process -FilePath $exe -ArgumentList @($doc) -PassThru
          try {
            $hasWindow = $false
            for ($i = 0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) {
                throw "MarkWisely exited before a main window was visible. Exit code: $($process.ExitCode)"
              }
              if ($process.MainWindowHandle -ne 0) {
                $hasWindow = $true
                break
              }
            }
            if (-not $hasWindow) {
              throw "MarkWisely did not create a main window on Windows."
            }

            if (-not $process.CloseMainWindow()) {
              throw "CloseMainWindow returned false."
            }
            if (-not $process.WaitForExit(20000)) {
              throw "MarkWisely did not exit after the Windows close request."
            }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Linux launch and close smoke
        if: startsWith(matrix.name, 'linux-')
        run: |
          set -euo pipefail
          app_path="src-tauri/target/${{ matrix.target }}/release/markwisely"
          test_doc="$RUNNER_TEMP/markwisely-open-smoke.md"
          printf '# Association Smoke\n\nOpened from argv.\n' > "$test_doc"
          test -x "$app_path"
          APP_PATH="$app_path" DOC_PATH="$test_doc" xvfb-run -a bash <<'EOF'
          set -euo pipefail
          pid=""
          openbox >/tmp/markwisely-openbox.log 2>&1 &
          wm_pid=$!
          trap 'if [ -n "${pid:-}" ]; then kill "$pid" 2>/dev/null || true; fi; kill "$wm_pid" 2>/dev/null || true' EXIT
          sleep 2

          "$APP_PATH" "$DOC_PATH" &
          pid=$!

          window_id=""
          close_tool=""
          for _ in $(seq 1 45); do
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid"
              echo "MarkWisely exited before a window was visible."
              exit 1
            fi
            window_id="$(wmctrl -lp 2>/dev/null | awk -v pid="$pid" '$3 == pid { print $1; exit }')"
            if [ -n "$window_id" ]; then
              close_tool="wmctrl"
              break
            fi
            window_id="$(xdotool search --pid "$pid" 2>/dev/null | head -n 1 || true)"
            if [ -n "$window_id" ]; then
              close_tool="xdotool"
              break
            fi
            sleep 1
          done
          test -n "$window_id"

          if [ "$close_tool" = "wmctrl" ]; then
            wmctrl -ic "$window_id"
          else
            xdotool windowactivate "$window_id" || true
            xdotool windowclose "$window_id"
          fi
          for _ in $(seq 1 20); do
            if ! kill -0 "$pid" 2>/dev/null; then
              kill "$wm_pid" 2>/dev/null || true
              trap - EXIT
              exit 0
            fi
            sleep 1
          done

          ps -p "$pid" -o pid=,command= || true
          echo "MarkWisely did not exit after the Linux close request."
          exit 1
          EOF
      - name: macOS bundle smoke
        if: startsWith(matrix.name, 'macos-')
        run: |
          set -euo pipefail
          test -d "src-tauri/target/${{ matrix.target }}/release/bundle/macos/MarkWisely.app"
          test -f src-tauri/target/${{ matrix.target }}/release/bundle/dmg/MarkWisely_*.dmg
          /usr/libexec/PlistBuddy -c "Print :CFBundleDocumentTypes" "src-tauri/target/${{ matrix.target }}/release/bundle/macos/MarkWisely.app/Contents/Info.plist" | grep -E 'md|markdown|text/markdown'
          codesign --verify --deep --strict "src-tauri/target/${{ matrix.target }}/release/bundle/macos/MarkWisely.app" || true
      - name: Windows installer smoke
        if: startsWith(matrix.name, 'windows-')
        shell: pwsh
        run: |
          $bundles = Get-ChildItem -Path "src-tauri/target/${{ matrix.target }}/release/bundle" -Recurse -Include *.msi,*.exe
          if (-not $bundles) { throw "No Windows installer bundles were generated." }
          $bundles | ForEach-Object { Write-Host $_.FullName }
      - name: Linux installer smoke
        if: startsWith(matrix.name, 'linux-')
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          deb="$(find "$bundle_dir" -name '*.deb' -print -quit)"
          rpm="$(find "$bundle_dir" -name '*.rpm' -print -quit)"
          test -n "$deb"
          test -n "$rpm"
          sudo apt-get install -y "./$deb"
          installed="$(command -v markwisely || true)"
          if [ -z "$installed" ]; then
            installed="$(find /usr -iname '*markwisely*' -type f -perm -111 -print -quit)"
          fi
          test -n "$installed"
          desktop_file="$(find /usr/share/applications -iname '*markwisely*.desktop' -print -quit)"
          test -n "$desktop_file"
          grep -q 'MimeType=.*text/markdown' "$desktop_file"
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: platform-smoke-${{ matrix.name }}
          path: src-tauri/target/**/bundle/**
